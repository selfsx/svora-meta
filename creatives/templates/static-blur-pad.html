<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<style>
  /* Square (or any) photo fitted whole into a 4:5 / 9:16 frame over a blurred, darkened copy of itself.
     Copy sits in the free band at the bottom; the logo top-left. Safe zone respected for 9:16. */
  @font-face { font-family: 'Roboto Condensed'; src: url('{{fontsDir}}/roboto-condensed/RobotoCondensed.ttf'); font-weight: 100 900; }
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: {{color_black}}; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; font-family: 'Roboto Condensed', sans-serif; color: {{color_cream}}; }
  .bg { position: absolute; inset: -60px; background: url('{{image}}') center / cover no-repeat; filter: blur(28px) brightness(.55) saturate(1.1); }
  .photo { position: absolute; left: 0; right: 0; top: 14%; height: 52%; background: url('{{image}}') center / contain no-repeat; }
  .logo { position: absolute; left: 56px; top: 56px; width: 220px; filter: drop-shadow(0 2px 10px rgba(0,0,0,.5)); }
  .badge { position: absolute; right: 56px; top: 64px; background: {{color_orange}}; color: {{color_black}}; font-weight: 800; font-size: 32px; padding: 10px 22px; border-radius: 999px; text-transform: uppercase; }
  .copy { position: absolute; left: 56px; right: 56px; top: 69%; }
  .hook { font-weight: 800; font-size: 78px; line-height: 1.02; text-transform: uppercase; letter-spacing: -0.01em; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  .hook b { color: {{color_orange}}; }
  .sub { margin-top: 16px; font-size: 38px; font-weight: 500; color: {{color_peach}}; }
  .row { margin-top: 30px; display: flex; align-items: center; gap: 26px; }
  .cta { background: {{color_orange}}; color: {{color_black}}; font-weight: 800; font-size: 40px; padding: 18px 38px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
  .price { font-size: 38px; font-weight: 700; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="photo"></div>
  <img class="logo" src="{{logosDir}}/light.png" alt="">
  <div class="badge" style="display:{{badge}}">{{badge}}</div>
  <div class="copy">
    <div class="hook">{{hook}}</div>
    <div class="sub">{{sub}}</div>
    <div class="row"><div class="cta">{{cta}}</div><div class="price">{{price}}</div></div>
  </div>
</div>
</body>
</html>

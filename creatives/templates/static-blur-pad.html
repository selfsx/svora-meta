<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{typeCss}}">
<style>
  /* A square / 4:5 / landscape photo shown whole inside a 9:16 or 4:5 frame, over a blurred, lightly dimmed
     copy of itself (tuning from the MAAG Snap uploader: blur σ28, dim 18%, foreground 92% wide, r16 corners,
     shadow 0/18/20 @ .5). The copy group overlays the photo where it is free (place=top|middle|bottom). */
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: {{color_black}}; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; }
  .bg { position: absolute; inset: -80px; background: url('{{image}}') center / cover no-repeat; filter: blur(28px); }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.18); }
  .fg { position: absolute; left: 50%; top: {{fg_top}}; transform: translate({{fg_shift}}); width: {{fg_w}}; border-radius: 16px; box-shadow: 0 18px 20px rgba(0,0,0,.5); display: block; }
</style>
</head>
<body>
<div class="stage tone-{{tone}}">
  <div class="bg"></div>
  <div class="dim"></div>
  <img class="fg" src="{{image}}" alt="">
  <img class="logo {{logo_pos}}" src="{{logosDir}}/light.png" alt="" style="display:{{logo_display}}">
  <div class="badge">{{badge}}</div>
  <div class="group {{place}} {{align}} with-logo">
    <div class="hook-wrap" style="display:{{hook_display}}"><span class="hook">{{hook}}</span></div>
    <div class="sub" style="display:{{sub_display}}">{{sub}}</div>
    <div class="cta" style="display:{{cta_display}}">{{cta}}</div>
    <div class="meta" style="display:{{meta_display}}">{{meta}}</div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{typeCss}}">
<style>
  /* "Which would you pick?" — hook, three numbered tiles, CTA, stacked and centred inside the safe band
     (logo line → bottom safe edge). Vars: image, image2, image3, hook, cta, meta, pick_h (tile row height). */
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: {{color_black}}; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; background: {{color_cream}}; }
  .stack { position: absolute; left: 40px; right: 40px; top: calc({{logo_top}} + 110px); bottom: {{group_bottom}}; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 34px; }
  .row { width: 100%; height: {{pick_h}}; display: flex; gap: 20px; flex: 0 0 auto; }
  .tile { flex: 1; position: relative; border-radius: 22px; overflow: hidden; background: #ddd center / cover no-repeat; box-shadow: 0 14px 30px rgba(0,0,0,.25); }
  .tile .n { position: absolute; left: 18px; top: 18px; width: 64px; height: 64px; border-radius: 50%; background: {{color_orange}}; color: {{color_black}}; font-weight: 800; font-size: 40px; display: flex; align-items: center; justify-content: center; }
  .hook-wrap { text-align: center; }
  .stage .hook { background: {{color_black}}; }
  .cta-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage .tag { font-size: {{tag_cta_size}}px; }
  .stage .chip { font-size: {{chip_cta_size}}px; background: transparent; color: {{color_black}}; border-color: {{color_black}}; }
  .logo { right: auto; left: 50%; transform: translateX(-50%); filter: none; }
</style>
</head>
<body>
<div class="stage">
  <img class="logo" src="{{logosDir}}/black.png" alt="">
  <div class="stack">
    <div class="hook-wrap" style="display:{{hook_display}}"><span class="hook">{{hook}}</span></div>
    <div class="row">
      <div class="tile" style="background-image:url('{{image}}')"><div class="n">1</div></div>
      <div class="tile" style="background-image:url('{{image2}}')"><div class="n">2</div></div>
      <div class="tile" style="background-image:url('{{image3}}')"><div class="n">3</div></div>
    </div>
    <div class="cta-stack">
      <div class="offerrow">
        <div class="tag">{{offer_pct}}</div>
        <div class="offercol">
          <div class="chip"><span class="lbl">{{chip_label}}</span><b>{{chip_code}}</b></div>
          <div class="cta" style="display:{{cta_display}}">{{cta}}</div>
        </div>
      </div>
      <div class="meta" style="display:{{meta_display}}">{{meta}}</div>
    </div>
  </div>
</div>
</body>
</html>

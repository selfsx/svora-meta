<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<style>
  /* Transparent overlay for a 9:16 / 4:5 / 1:1 video. Text stays inside Meta's safe zone:
     top 14% and bottom 35% are reserved for the Reels/Stories UI. */
  @font-face { font-family: 'Roboto Condensed'; src: url('{{fontsDir}}/roboto-condensed/RobotoCondensed.ttf'); font-weight: 100 900; }
  @font-face { font-family: 'Antonio'; src: url('{{fontsDir}}/antonio/Antonio-Bold.ttf'); font-weight: 700; }
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: transparent; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; font-family: 'Roboto Condensed', sans-serif; color: {{color_cream}}; }
  .top { position: absolute; left: 64px; right: 300px; top: 16%; display: flex; flex-direction: column; gap: 18px; }
  .hook {
    font-weight: 800; font-size: 84px; line-height: 1.02; letter-spacing: -0.01em; text-transform: uppercase;
    text-shadow: 0 2px 24px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.8);
  }
  .hook b { color: {{color_orange}}; }
  .sub { font-size: 42px; font-weight: 500; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  .bottom { position: absolute; left: 64px; right: 64px; bottom: 37%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .cta { background: {{color_orange}}; color: {{color_black}}; font-weight: 800; font-size: 46px; padding: 22px 44px; border-radius: 999px; text-transform: uppercase; letter-spacing: .01em; box-shadow: 0 8px 30px rgba(0,0,0,.35); white-space: nowrap; }
  .price { color: {{color_cream}}; font-weight: 700; font-size: 44px; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  .logo { position: absolute; right: 64px; top: 15%; width: 220px; opacity: .95; filter: drop-shadow(0 2px 10px rgba(0,0,0,.5)); }
  .badge { position: absolute; left: 64px; top: calc(16% - 76px); background: rgba(26,26,26,.72); color: {{color_peach}}; font-size: 34px; font-weight: 700; padding: 10px 22px; border-radius: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .ai { position: absolute; right: 64px; bottom: 36.5%; font-size: 24px; opacity: .7; }
</style>
</head>
<body>
<div class="stage">
  <img class="logo" src="{{logosDir}}/light.png" alt="">
  <div class="badge" style="display:{{badge}}" >{{badge}}</div>
  <div class="top">
    <div class="hook">{{hook}}</div>
    <div class="sub">{{sub}}</div>
  </div>
  <div class="bottom">
    <div class="cta">{{cta}}</div>
    <div class="price">{{price}}</div>
  </div>
</div>
</body>
</html>

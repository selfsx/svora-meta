<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{typeCss}}">
<style>
  /* Transparent overlay for video. Text stays inside Meta's safe zone (9:16: top 14% / bottom 35% are UI).
     Vars: hook (with <b>accent</b>), sub, cta, meta, place=top|middle|bottom (from describe-image), tone=dark|light, badge. */
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: transparent; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; }
  /* the offer (offer_pct → .tag, offer_code → .chip) rides with the CTA, in the same free band: tag left, chip over the pill */
  .stage .tag { font-size: {{tag_cta_size}}px; }
  .stage .chip { font-size: {{chip_cta_size}}px; }
</style>
</head>
<body>
<div class="stage tone-{{tone}}">
  <img class="logo {{logo_pos}}" src="{{logosDir}}/light.png" alt="" style="display:{{logo_display}}">
  <div class="badge">{{badge}}</div>
  <div class="group {{place}} {{align}} with-logo">
    <div class="hook-wrap" style="display:{{hook_display}}"><span class="hook">{{hook}}</span></div>
    <div class="sub" style="display:{{sub_display}}">{{sub}}</div>
  </div>
  <div class="ctagroup {{align}}">
    <div class="offerrow {{offer_stack}}">
      <div class="tag {{tag_class}}"><span class="n">{{offer_pct}}</span><span class="l">{{offer_label}}</span></div>
      <div class="offercol">
        <div class="chip"><span class="lbl">{{chip_label}}</span><b>{{chip_code}}</b></div>
        <div class="cta" style="display:{{cta_display}}">{{cta}}</div>
        <div class="meta" style="display:{{meta_display}}">{{meta}}</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

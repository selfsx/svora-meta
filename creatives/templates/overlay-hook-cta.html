<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{typeCss}}">
<style>
  /* Transparent overlay for video. Text stays inside Meta's safe zone (9:16: top 14% / bottom 35% are UI).
     Vars: hook (with <b>accent</b>), sub, cta, meta, place=top|middle|bottom (from describe-image), tone=dark|light, badge. */
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: transparent; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; }
</style>
</head>
<body>
<div class="stage tone-{{tone}}">
  <img class="logo" src="{{logosDir}}/light.png" alt="" style="display:{{logo_display}}">
  <div class="badge">{{badge}}</div>
  <div class="group {{place}} with-logo">
    <div class="hook-wrap" style="display:{{hook_display}}"><span class="hook">{{hook}}</span></div>
    <div class="sub" style="display:{{sub_display}}">{{sub}}</div>
    <div class="cta" style="display:{{cta_display}}">{{cta}}</div>
    <div class="meta" style="display:{{meta_display}}">{{meta}}</div>
  </div>
</div>
</body>
</html>

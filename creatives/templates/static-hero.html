<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{typeCss}}">
<style>
  /* Full static: the photo fills the frame (cover crop), the copy group sits where the photo is free
     (place=top|middle|bottom from describe-image). A soft scrim behind the group side only. */
  html, body { margin: 0; width: {{w}}px; height: {{h}}px; background: {{color_black}}; overflow: hidden; }
  .stage { position: relative; width: {{w}}px; height: {{h}}px; }
  .photo { position: absolute; inset: 0; background: url('{{image}}') {{photo_pos}} / cover no-repeat; }
  .scrim { position: absolute; inset: 0; }
  .scrim.top    { background: linear-gradient(180deg, rgba(26,26,26,.55) 0%, rgba(26,26,26,0) 45%); }
  .scrim.middle { background: radial-gradient(ellipse at 50% 50%, rgba(26,26,26,.35) 0%, rgba(26,26,26,0) 65%); }
  .scrim.bottom { background: linear-gradient(0deg, rgba(26,26,26,.6) 0%, rgba(26,26,26,0) 45%); }
</style>
</head>
<body>
<div class="stage tone-{{tone}}">
  <div class="photo"></div>
  <div class="scrim {{place}}"></div>
  <img class="logo" src="{{logosDir}}/light.png" alt="" style="display:{{logo_display}}">
  <div class="badge">{{badge}}</div>
  <div class="group {{place}} with-logo">
    <div class="hook-wrap" style="display:{{hook_display}}"><span class="hook">{{hook}}</span></div>
    <div class="sub" style="display:{{sub_display}}">{{sub}}</div>
    <div class="cta" style="display:{{cta_display}}">{{cta}}</div>
    <div class="meta" style="display:{{meta_display}}">{{meta}}</div>
  </div>
</div>
</body>
</html>

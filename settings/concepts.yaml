# Creative concepts — the vocabulary for creative names, copy files and campaign specs.
# A concept is "what we show + what we promise". Hooks are the first 1–3 seconds / the headline angle.

concepts:
  classic: { label: "Nude, French, milky, glazed — clean premium manicure", services: [hybrid-manicure, clean-manicure, french], copy_dir: copy/classic }
  art:     { label: "Hand-painted designs, florals, chrome, textures", services: [hybrid-manicure, advanced-art], copy_dir: copy/art }
  crazy:   { label: "3D forms, extra long, cat claws, sculpted — the signature", services: [extra-long-crazy, cat-claws, crazy-art, extensions], copy_dir: copy/crazy }
  pedi:    { label: "Pedicure — clean and hybrid", services: [clean-pedicure, hybrid-pedicure], copy_dir: copy/pedi }
  brows:   { label: "Brow shaping, lamination, tinting (Ksenia)", services: [brow-shaping, brow-lamination], copy_dir: copy/brows }
  brand:   { label: "The studio itself: team, interior, Ukrainian-speaking, Wola, online booking", services: [], copy_dir: copy/brand }
  mix:     { label: "Portfolio mix across styles (carousels, montage reels)", services: [], copy_dir: copy/mix }

hooks:
  reveal:     "slow reveal of the finished set (hand enters frame, turns, light catches the gloss)"
  process:    "ASMR process cut: filing / painting / top coat → result"
  before-after: "before → after on the same hand"
  pov:        "POV: you booked SVORA — client walks in, sits, shows nails"
  social:     "'everyone asks where I did my nails' — social-proof angle"
  found:      "'finally found my salon in Warsaw' — relocation/diaspora angle"
  price:      "price anchor up front (hybrid 190 zł, clean 120 zł)"
  speed:      "book online in 1 minute / slots today"
  art-closeup: "macro close-up on one nail's art, then pull out"
  team:       "the master at work, face visible, speaks the client's language"

# Angles — the diversity axis Meta's retrieval actually separates (research/andromeda-creative-diversity.md §5).
# A creative carries exactly one angle in its manifest entry; an ad set should hold ≥ 6 distinct angles.
# Overlay language, hook text, crop, colour grade do NOT change the angle — if the overlay is removed and two
# creatives look the same, they are the same angle AND the same ad.
angles:
  hero:         { label: "Hero close-up (motion or still): the finished set, no talking", from_closeups: true }
  before-after: { label: "Bare/old nails → finished set, split or hard cut", from_closeups: partly }
  process:      { label: "Process / ASMR: filing, gel, top coat, hands at work, tool sounds", from_closeups: false }
  founder:      { label: "Founder talking head (UA): what to expect, why SVORA", from_closeups: false }
  studio:       { label: "Studio life / POV 'your 90 minutes': walk-in, chair, atmosphere", from_closeups: false }
  ugc:          { label: "Client shows the nails / reacts — needs written permission", from_closeups: false }
  review:       { label: "One real review as a text card on a brand background", from_closeups: false }
  price:        { label: "One offer/price from settings/brand.yaml, text-led", from_closeups: partly }
  pick:         { label: "'Which would you pick?' — three sets side by side, question hook", from_closeups: true }
  location:     { label: "Wola street, entrance, how to find us, hours, booking steps", from_closeups: false }
  meme:         { label: "Plain-text relatable nail-day line, no photo", from_closeups: false }
  seasonal:     { label: "Season / event palette, refreshable slot", from_closeups: true }

# Statics render at 1080; videos are delivered at 720p (Seedance's native 720x1280 — enough for an ad, no upscaling).
formats:
  9x16: { w: 1080, h: 1920, video: { w: 720, h: 1280 }, placements: [reels, stories], primary: true }
  4x5:  { w: 1080, h: 1350, video: { w: 720, h: 900 },  placements: [feed] }
  1x1:  { w: 1080, h: 1080, video: { w: 720, h: 720 },  placements: [feed, carousel] }

types: { vd: video, st: static, cr: carousel-card }
langs: [pl, ua, ru, en]

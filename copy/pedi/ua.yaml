primaries:
  p01: "Довго шукала у Варшаві педикюр, на який хочеться повертатись. Знайшла на Волі. CLEAN 175 zł, гібридний 235 zł. SVORA NAILS 🤍"
  p02: "Подруга скинула контакт і сказала: «запишись на педикюр, не пошкодуєш». Вероніка робить акуратно й швидко. Воля, Fresha."
  p03: "Мене питають, де роблю педикюр. SVORA NAILS на Волі. Чисто, спокійно, час для себе. CLEAN педикюр 175 zł."
  p04: "Що таке CLEAN педикюр за 175 zł? Доглянуті стопи й нігті без покриття, 75 хвилин. Для тих, хто любить натуральне. Воля."
  p05: "Гібридний педикюр 235 zł: догляд плюс покриття за один візит. Nude або яскравий, обирай у кріслі. SVORA NAILS, Воля."
  p06: "Манікюр і педикюр за один візит у Варшаві. Запишись на обидві послуги підряд, і вечір вільний. SVORA NAILS, Воля."
  p07: "CLEAN педикюр 175 zł, гібридний 235 zł. Воля, Jana Kazimierza 25B, щодня 9:00–21:00. Запис онлайн у Fresha за хвилину 💅"
  p08: "Вільні вікна на педикюр цього тижня. Обирай час у Fresha, приходь, решту зробимо ми. SVORA NAILS, Воля, Варшава."

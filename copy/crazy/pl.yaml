primaries:
  p01: "Zatrzymały mnie dwie dziewczyny w metrze, żeby zapytać, gdzie robię paznokcie. SVORA NAILS, Wola. No to już wiecie 💅"
  p02: "Chciałam coś, czego nikt na imprezie nie będzie miał. Karina zrobiła formy 3D na extra długich. Nikt nie miał. SVORA, Wola"
  p03: "Mój chłopak powiedział, że to przesada. Potem sam zrobił im zdjęcie. Extra Long & Crazy Shape 380 zł. Polecam 🧡"
  p04: "Zbliż. Jeszcze bliżej. Tak, ta rzeźba na paznokciu jest prawdziwa i da się z nią pisać na telefonie. SVORA NAILS, Wola"
  p05: "Co się dzieje, kiedy przychodzisz z hasłem „zrób, co chcesz”? Karina ma odpowiedź. Crazy art, formy 3D od 45 zł. Wola"
  p06: "Cat Claws. Od 420 zł. 3,5 godziny. Wychodzisz z pazurami, które mają własną osobowość. SVORA NAILS, Jana Kazimierza 25B"
  p07: "Extra Long & Crazy Shape 380 zł, Cat Claws od 420 zł, przedłużanie od 300 zł. Codziennie 9–21 na Woli. Rezerwuj na Fresha"
  p08: "Formy 3D, extra długie, rzeźbione. Wolne terminy na ten tydzień widać na Fresha. SVORA NAILS, Wola. Zarezerwuj online 💅"

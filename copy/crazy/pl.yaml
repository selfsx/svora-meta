concept: crazy
lang: pl
tone: "informal Ty; spoken Warsaw Polish; the signature: 3D forms, extra long, Cat Claws; Extra Long & Crazy Shape 380 zł, Cat Claws od 420 zł, crazy art od 45 zł, przedłużanie od 300 zł"
headlines:
  h01: "Extra Long & Crazy Shape 380 zł"
  h02: "Formy 3D na paznokciach. Serio"
  h03: "Cat Claws od 420 zł. Tak, pazury"
  h04: "Przedłużanie od 300 zł, Wola"
  h05: "Tego się nie da nie zauważyć"

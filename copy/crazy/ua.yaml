primaries:
  p01: "Мене зупиняють на вулиці й питають, де такі нігті. SVORA NAILS, Воля. Extra Long & Crazy Shape 380 zł. Тепер знаєш і ти 💎"
  p02: "Показала подрузі Cat Claws, вона не повірила, що це Варшава. Карина робить форми, які не сплутаєш. Воля, запис у Fresha."
  p03: "Подруга скинула контакт із підписом «тут роблять crazy». Через три години я вийшла з 3D-формами на нігтях. SVORA NAILS 🤍"
  p04: "Це не фільтр і не Pinterest. Це Cat Claws від 420 zł, зроблені на Волі. Подивись ближче, світло ловить кожну грань."
  p05: "Що буде, якщо дати майстрині повну свободу на 3,5 години? Extra Long & Crazy Shape 380 zł. SVORA NAILS, Варшава."
  p06: "3D-форми від 45 zł до покриття. Скульптура, ланцюжки, рідкий метал. Такі нігті роблять на Волі, Jana Kazimierza 25B."
  p07: "Extra Long & Crazy Shape 380 zł, Cat Claws від 420 zł, нарощування від 300 zł. Воля, щодня 9:00–21:00. Запис у Fresha 💎"
  p08: "Хочеш довгі скульптурні нігті, а не просто покриття? Карина й Вероніка роблять форму з нуля. SVORA NAILS, Воля. Запис онлайн."

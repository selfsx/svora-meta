primaries:
  p01: "Меня останавливают на улице: где такие ногти? SVORA NAILS, Воля. Extra Long & Crazy Shape 380 zł. Теперь знаешь и ты 💎"
  p02: "Показала подруге Cat Claws, она не поверила, что это Варшава. Карина делает формы, которые не спутаешь. Воля, Fresha."
  p03: "Подруга скинула контакт с подписью «здесь делают crazy». Через три часа я вышла с 3D-формами на ногтях. SVORA NAILS 🤍"
  p04: "Это не фильтр и не Pinterest. Это Cat Claws от 420 zł, сделанные на Воле. Посмотри ближе, свет ловит каждую грань."
  p05: "Что будет, если дать мастеру полную свободу на 3,5 часа? Extra Long & Crazy Shape 380 zł. SVORA NAILS, Варшава."
  p06: "3D-формы от 45 zł к покрытию. Скульптура, цепочки, жидкий металл. Такие ногти делают на Воле, Jana Kazimierza 25B."
  p07: "Extra Long & Crazy Shape 380 zł, Cat Claws от 420 zł, наращивание от 300 zł. Воля, ежедневно 9:00–21:00. Запись в Fresha 💎"
  p08: "Хочешь длинные скульптурные ногти, а не просто покрытие? Карина и Вероника делают форму с нуля. SVORA NAILS, Воля, Fresha."

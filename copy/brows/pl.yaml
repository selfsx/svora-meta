primaries:
  p01: "Przyszłam na hybrydę, wyszłam z hybrydą i brwiami. Ksenia dołożyła laminację w pół godziny. Teraz zawsze razem 🧡"
  p02: "Koleżanka zapytała, czy zrobiłam coś z twarzą. Zrobiłam. Brwi u Ksenii, SVORA NAILS, Wola, 70 zł. Tyle"
  p03: "Szukałam kogoś, kto nie wyrwie mi połowy brwi. Znalazłam Ksenię. Regulacja 70 zł, Wola, rezerwacja na Fresha 🤍"
  p04: "Co robi laminacja? Układa brwi tak, jak chcesz, i trzyma je tam bez żelu. 30 minut, 70 zł. Ksenia, SVORA NAILS, Wola"
  p05: "Brwi widać na każdym zdjęciu, a paznokcie tylko na niektórych. Czas to wyrównać. Brwi od 70 zł. SVORA, Jana Kazimierza 25B"
  p06: "Jedna wizyta, dwie rzeczy: hybryda u Maryny, brwi u Ksenii. Wychodzisz i widać różnicę. SVORA NAILS, Wola"
  p07: "Regulacja brwi 70 zł, laminacja 70 zł. SVORA NAILS, Wola, codziennie 9–21. Zarezerwuj online na Fresha 🧡"
  p08: "Dołóż brwi do manicure w jednej rezerwacji na Fresha. 30 minut więcej, 70 zł. SVORA NAILS, Jana Kazimierza 25B, Wola"

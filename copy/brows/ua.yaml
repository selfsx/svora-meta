primaries:
  p01: "Нарешті знайшла свого бровиста у Варшаві. Ксенія в SVORA NAILS на Волі. Корекція 70 zł, 30 хвилин, і форма нарешті моя 🤍"
  p02: "Подруга скинула контакт: «брови до Ксенії, не сперечайся». Не сперечалась. Ламінування 70 zł на Волі, запис через Fresha."
  p03: "Мене питають, що я зробила з бровами. Нічого особливого: корекція і ламінування у SVORA NAILS. Воля, від 70 zł 💅"
  p04: "Що дає ламінування за 70 zł? Волоски лягають у форму, і ранок стає коротшим. 30 хвилин у Ксенії на Волі."
  p05: "Форма брів, яка пасує саме твоєму обличчю, а не тренду з TikTok. Ксенія підбирає її за 30 хвилин. SVORA NAILS, Воля."
  p06: "Прийшла на манікюр, вийшла з бровами. Корекція 70 zł у той самий візит. SVORA NAILS, Воля, Варшава."
  p07: "Корекція брів 70 zł, ламінування 70 zł. Ксенія, SVORA NAILS, Воля, щодня 9:00–21:00. Обирай час онлайн у Fresha ✨"
  p08: "Запишись на нігті й брови підряд і закрий обидва питання за один візит. SVORA NAILS, Воля. Запис онлайн у Fresha."

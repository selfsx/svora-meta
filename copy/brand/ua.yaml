primaries:
  p01: "Переїхала і шукала майстриню, якій не треба пояснювати 10 разів. Знайшла на Волі: українська команда, онлайн-запис. SVORA 🤍"
  p02: "Подруга скинула контакт, і тепер ходжу тільки сюди. Рідна мова, чисто, спокійно, без зайвих питань. SVORA NAILS, Воля."
  p03: "Мене всі питають, де роблю нігті. SVORA NAILS, Воля. Марʼяна зібрала команду, якій довіряєш з першого візиту. Запис у Fresha."
  p04: "Студія, яку відкрила українська команда у Варшаві. Nude і crazy в одному кріслі. Що обереш сьогодні? Воля, щодня 9:00–21:00."
  p05: "Українською, російською, польською, англійською — обирай, якою зручно. Розуміємо з півслова. SVORA NAILS, Воля, Варшава."
  p06: "Зайди і подивись, як виглядає студія, в якій хочеться залишитись довше, ніж триває манікюр. Воля, Jana Kazimierza 25B."
  p07: "SVORA NAILS, Воля, Jana Kazimierza 25B. Щодня 9:00–21:00. Гібридний манікюр 190 zł. Обирай час онлайн у Fresha за хвилину 💅"
  p08: "Нігті, педикюр і брови в одному місці на Волі. Українська команда, онлайн-запис через Fresha. Вільні вікна на цьому тижні."

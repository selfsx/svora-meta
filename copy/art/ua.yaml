primaries:
  p01: "Показала майстрині фото з Pinterest, а вийшло краще за фото. Квіти від руки, тонкі лінії. SVORA NAILS, Воля. Ділюсь 🎨"
  p02: "Мене питають, хто малював. Відповідаю: SVORA NAILS на Волі. Гібридний манікюр 190 zł, дизайн від 25 zł. Запис у Fresha."
  p03: "Подруга скинула контакт зі словами «тут малюють». Тепер у мене півонії на нігтях і черга з питань. Воля, Варшава 🤍"
  p04: "Так, це намальовано вручну. Кожна пелюстка, кожна лінія — тонким пензлем. Advanced art від 25 zł. SVORA NAILS, Воля."
  p05: "Хром, акварель, порцеляна, леопард. Одна майстриня, один сеанс. Що б обрала ти? Подивись, як це виглядає наживо. Воля."
  p06: "Дизайн, який не забувається після фото. Макро на один ніготь, і ти зрозумієш. SVORA NAILS, Варшава, Воля."
  p07: "Гібридний манікюр 190 zł плюс авторський дизайн від 25 zł. Воля, щодня 9:00–21:00. Обирай час онлайн у Fresha 🎨"
  p08: "Хочеш квіти, хром або мінімалізм на нігтях? Покажи референс при записі, решту зробимо. SVORA NAILS, Воля. Запис онлайн."

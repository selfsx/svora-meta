primaries:
  p01: "Pokazałam Karinie zdjęcie z Pinteresta i wyszło lepiej niż w oryginale. Ręcznie malowane kwiaty, zero naklejek. SVORA, Wola 🎨"
  p02: "W pracy trzy osoby już zapytały o salon. SVORA NAILS, Wola. Hybryda 190 zł plus art od 10 zł. Teraz wiecie wszyscy"
  p03: "Chrome na milky, mały kwiatek na serdecznym. Maryna wie, kiedy mniej znaczy lepiej. Chodzę do SVORA od wiosny i zostaję 🤍"
  p04: "Zbliż się do ekranu. Każdy płatek malowany pędzelkiem. Advanced art od 25 zł do hybrydy 190 zł. SVORA NAILS, Wola"
  p05: "Masz w telefonie 40 zrzutów ekranu z paznokciami? Przynieś jeden. Resztę zrobi Karina. SVORA NAILS, Jana Kazimierza 25B"
  p06: "Chrome na milky? Mikro-kwiatki na French? Da się, i to tak, że nikt nie zgadnie, ile to kosztowało. Art od 10 zł. SVORA, Wola"
  p07: "Hybryda 190 zł + easy art od 10 zł lub advanced art od 25 zł. Codziennie 9–21 na Woli. Wybierz termin na Fresha 🎨"
  p08: "Chcesz design na konkretny dzień? Wolne terminy widać na Fresha od razu. SVORA NAILS, Jana Kazimierza 25B, Wola"

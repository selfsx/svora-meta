primaries:
  p01: "Показала мастеру фото из Pinterest, а получилось лучше, чем на фото. Цветы от руки, тонкие линии. SVORA NAILS, Воля. Делюсь 🎨"
  p02: "Меня спрашивают, кто рисовал. Отвечаю: SVORA NAILS на Воле. Гибридный маникюр 190 zł, дизайн от 25 zł. Запись в Fresha."
  p03: "Подруга скинула контакт со словами «здесь рисуют». Теперь у меня пионы на ногтях и очередь из вопросов. Воля, Варшава 🤍"
  p04: "Да, это нарисовано вручную. Каждый лепесток, каждая линия — тонкой кистью. Advanced art от 25 zł. SVORA NAILS, Воля."
  p05: "Хром, акварель, фарфор, леопард. Один мастер, один сеанс. Что бы выбрала ты? Посмотри, как это выглядит вживую. Воля."
  p06: "Дизайн, который не забывается после фото. Макро на один ноготь, и ты поймёшь. SVORA NAILS, Варшава, Воля."
  p07: "Гибридный маникюр 190 zł плюс авторский дизайн от 25 zł. Воля, ежедневно 9:00–21:00. Выбирай время онлайн в Fresha 🎨"
  p08: "Хочешь цветы, хром или минимализм на ногтях? Покажи референс при записи, остальное сделаем. SVORA NAILS, Воля. Запись онлайн."
